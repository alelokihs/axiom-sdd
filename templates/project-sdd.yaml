# sdd/sdd.yaml — consumer project manifest (generated by bootstrap; humans may edit)
sdd:
  version: 1.0.0            # framework version installed (see bootstrap/INSTALL.md for updates)
  role: consumer
  installed: <YYYY-MM-DD>
  template: <path-or-url-of-the-framework-template>

project:
  name: <name>
  mode: existing | new
  runtimes: [claude]        # claude | copilot | devin | codex — adapters generated for each

profile:
  default: <profile-name>   # resolved copy lives in sdd/profile.yaml

models:                     # proposed by bootstrap (no human in the loop) — edit to override
  selected_by: bootstrap (auto)   # rules: sdd/bootstrap/model-selection.md
  planning:     {tier: frontier | balanced | fast, resolved: <per adapter table>}
  execution:    {tier: <…>, resolved: <…>}
  verification: {tier: <…>, resolved: <…>}
  support:      {tier: fast, resolved: <…>}

detected:                   # every value labeled — never silently invented
  language: {value: <…>, confidence: CONFIRMED | INFERRED | UNKNOWN}
  framework: {value: <…>, confidence: <…>}
  build: {value: <…>, confidence: <…>}
  package_manager: {value: <…>, confidence: <…>}
  tests: {value: <…>, confidence: <…>}
  lint_format: {value: <…>, confidence: <…>}
  architecture: {value: <…>, confidence: <…>}
  database: {value: <…>, confidence: <…>}
  ci: {value: <…>, confidence: <…>}
  docs: {value: <…>, confidence: <…>}

gitflow:
  style: {value: github-flow | gitflow | trunk | custom, confidence: <…>}
  branch_pattern: {value: "<prefix>/<NNN>-<slug>", confidence: <…>}
  commit_convention: {value: conventional | ticket-prefix | free, confidence: <…>}
  merge_policy: {value: merge | squash | rebase, confidence: <…>}

customized:                 # project-owned files — framework updates NEVER overwrite these
  - sdd/guardrails.md
  - sdd/constitution.md     # if amended
  - AGENTS.md               # repo root — regenerated by axiom install
