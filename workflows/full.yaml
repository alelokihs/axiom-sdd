workflow: full
description: Maximum-assurance pipeline for architectural or high-risk work.
spec_form: full
steps:
  - agent: requirement-analyst
  - agent: codebase-analyst
    mode: legacy
    optional: existing-codebase
  - agent: spec-writer
    mode: write
  - agent: spec-writer
    mode: validate
    gate: spec-ready
  - agent: architect
    mode: assess
  - agent: spec-writer            # PLAN
    mode: write
  - agent: architect
    mode: approve
    gate: plan-approved
  - agent: spec-writer            # TASKS
    mode: write
  - agent: codebase-analyst
    mode: context-pack
  - agent: implementer
    gate: definition-of-ready
  - agent: test-engineer
    gate: tests-passing
  - agent: security
    optional: profile-requires-security
    gate: security-clear
  - agent: reviewer
    mode: code+compliance+drift
    gate: spec-drift-none
  - agent: docs
    optional: docs-affected
  - agent: gitflow
    gate: evidence-complete
followup_required: false
